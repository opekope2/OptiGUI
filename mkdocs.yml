site_name: OptiGUI documentation
repo_url: https://github.com/opekope2/OptiGUI
copyright: © 2022-2025 opekope2. OptiGUI is not an official Minecraft product. Not associated with or endorsed by Mojang Studios.
theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    scheme: slate
  features:
    - navigation.expand
    - content.code.copy
nav:
  - Home: index.md
  - Supported resource formats:
    - OptiGUI JSON: JSON.md
    - OptiGUI INI: INI.md
    - OptiFine properties: https://optifine.readthedocs.io/custom_guis.html
  - No longer supported resource formats:
    - Extensions to OptiFine properties - migration guide: Properties-extensions.md
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.caret
extra_css:
  - stylesheets/chips.css
use_directory_urls: false
