[versions]
java = "17"
kotlin = "1.9.20"
optigui = "3.0.0-alpha.1+1.20"
minecraft = "1.20"
yarn = "1.20+build.1"
fabric-loom = "1.8-SNAPSHOT" # 1.9 refuses to resolve dependencies
fabric-loader = "0.16.10"
fabric-api = "0.83.0+1.20"
fabric-language-kotlin = "1.10.11+kotlin.1.9.20"
commons-text = "1.13.0"
ini4j = "0.5.4"

[libraries]
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
yarn = { group = "net.fabricmc", name = "yarn", version.ref = "yarn" }
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric-loader" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabric-api" }
fabric-language-kotlin = { group = "net.fabricmc", name = "fabric-language-kotlin", version.ref = "fabric-language-kotlin" }
apache-commons-text = { group = "org.apache.commons", name = "commons-text", version.ref = "commons-text" }
ini4j = { group = "org.ini4j", name = "ini4j", version.ref = "ini4j" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
fabric-loom = { id = "fabric-loom", version.ref = "fabric-loom" }
