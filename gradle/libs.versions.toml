[versions]
java = "21"
kotlin = "2.1.0"
optigui = "3.0.0-alpha.3"
minecraft = "1.21"
parchment = "2024.11.10"
jspecify = "1.0.0"
architectury = "3.4-SNAPSHOT"
loom = "1.11-SNAPSHOT"
fabric-loader = "0.16.10"
fabric-api = "0.102.0+1.21"
fabric-language-kotlin = "1.13.0+kotlin.2.1.0"
shadow = "8.3.6"
ini4j = "0.5.4"
cloth-config-fabric = "15.0.127"
modmenu = "11.0.0"

[libraries]
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
parchment = { group = "org.parchmentmc.data", name = "parchment-1.21", version.ref = "parchment" }
jspecify = { group = "org.jspecify", name = "jspecify", version.ref = "jspecify" }
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric-loader" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabric-api" }
fabric-language-kotlin = { group = "net.fabricmc", name = "fabric-language-kotlin", version.ref = "fabric-language-kotlin" }
ini4j = { group = "org.ini4j", name = "ini4j", version.ref = "ini4j" }
cloth-config-fabric = { group = "me.shedaniel.cloth", name = "cloth-config-fabric", version.ref = "cloth-config-fabric" }
modmenu = { group = "com.terraformersmc", name = "modmenu", version.ref = "modmenu" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
architectury = { id = "architectury-plugin", version.ref = "architectury" }
loom = { id = "dev.architectury.loom", version.ref = "loom" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
